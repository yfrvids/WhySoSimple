---
layout: default
title: Blog
---
<head>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>

<h1>Latest Posts</h1>

<ul class="latestpostsul">
  {% for post in site.posts %}
    <li class="tituloPost">
	<a href="{{ post.url }}">{{ post.title }}</a><br>
	<span class="elementoUltimoFecha">{{post.date | date_to_string}}</span><br>
	<span class="elementoUltimoDescripcion"><a href="{{ post.url }}" style="text-decoration:none;color:#000000;">{{ post.description }}</a></span><br><br>
    </li>
    <li class="tagsDePost">
	<span style="display:flex;">{% for tag in post.tags %}
		<a style="margin-right:5px;color:#000000;" class="tagDePost" href="tags/{{tag}}.html">{{ tag }}</a>
                {% endfor %}</span>
    </li><br>
  {% endfor %}
</ul>
